name: CI (Before Optimization)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== 1. LINT & CACHE (МЕДЛЕННО) ====================
  lint-and-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ❌ УБРАЛИ КЭШИРОВАНИЕ – каждый раз качает пакеты заново
      - name: Install dependencies (no cache)
        run: pip install -r requirements.txt

      # ⏳ Искусственная задержка 3 минуты (эмулирует долгую установку)
      - name: Simulate heavy dependency install
        run: sleep 180

      - name: Lint with flake8
        run: flake8 src/

  # ==================== 2. TESTS (ПОСЛЕДОВАТЕЛЬНО, БЕЗ ПАРАЛЛЕЛИЗАЦИИ) ====================
  test:
    needs: lint-and-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ❌ Снова установка без кэша
      - name: Install dependencies (no cache)
        run: pip install -r requirements.txt

      # 🔄 Все тесты выполняются последовательно в одной джобе
      - name: Run unit tests
        run: pytest tests/unit/ --timeout=300 || true

      - name: Run integration tests (with delay)
        run: |
          sleep 60  # имитация долгих интеграционных тестов
          pytest tests/integration/ || true

      - name: Run e2e tests (with heavy setup)
        run: |
          sleep 90  # имитация запуска окружения
          pytest tests/e2e/ || true

  # ==================== 3. SECURITY (ДОБАВЛЕНА ЗАДЕРЖКА) ====================
  security-sast:
    needs: lint-and-cache
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      # ⏳ Задержка перед сканированием
      - name: Wait before scan
        run: sleep 30
      - name: Bandit scan
        run: bandit -r src/ -ll -f json -o bandit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  security-sca:
    needs: lint-and-cache
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Check dependencies (with delay)
        run: |
          sleep 20
          pip-audit --requirement requirements.txt --strict

  security-gate:
    needs: [security-sast, security-sca]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - name: Gate
        run: |
          SAST_RESULT="${{ needs.security-sast.result }}"
          SCA_RESULT="${{ needs.security-sca.result }}"
          if [ "$SAST_RESULT" = "skipped" ] || [ "$SCA_RESULT" = "skipped" ]; then
            echo "Security checks were skipped, failing gate"
            exit 1
          elif [ "$SAST_RESULT" != "success" ] || [ "$SCA_RESULT" != "success" ]; then
            echo "Security checks failed"
            exit 1
          fi
          echo "All security checks passed"

  # ==================== 4. DOCKER BUILD (БЕЗ КЭША BUILDKIT, С ЗАДЕРЖКОЙ) ====================
  build-and-push:
    needs: [test, security-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ❌ Не используем Buildx с кэшем – стандартный медленный docker build
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.BOT }}

      # ⏳ Эмуляция долгой сборки образа
      - name: Build image (slow, no cache)
        run: |
          sleep 60
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
