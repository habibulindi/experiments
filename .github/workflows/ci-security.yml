name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 🔍 Secret Detection
  secret-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: gitleaks.toml
          report-path: artifacts/gitleaks-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: artifacts/gitleaks-report.json

  # 🔍 SCA Scan
  sca-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          output: "trivy-fs-report.txt"

      - name: Save JSON report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "json"
          output: "artifacts/trivy-fs-report.json"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: artifacts/trivy-fs-report.json

  # 🐳 Build + Scan Image (в одном job!)
  build-and-scan:
    runs-on: ubuntu-latest
    needs: [secret-detection, sca-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true  # 🔑 Важно для локального сканирования!
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          output: "trivy-image-report.txt"

      - name: Scan image (JSON output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "json"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          output: "artifacts/trivy-image-report.json"

      - name: Upload image reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: |
            trivy-image-report.txt
            artifacts/trivy-image-report.json

  # 📦 SBOM Generation
  sbom-generation:
    runs-on: ubuntu-latest
    needs: [build-and-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: "."
          format: "cyclonedx-json"
          output-file: "artifacts/sbom.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom.json
