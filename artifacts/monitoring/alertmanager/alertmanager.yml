global:
  resolve_timeout: 5m
  # 📧 SMTP настройки (замените на ваши!)
  smtp_smarthost: 'smtp.yandex.ru:465'
  smtp_from: 'alertmanager@yourdomain.ru'
  smtp_auth_username: 'your-username@yandex.ru'
  smtp_auth_password: 'YOUR_APP_PASSWORD'  # ← Используйте App Password!
  smtp_require_tls: true

route:
  receiver: 'email-default'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'email-critical'
      continue: true
    - match:
        severity: warning
      receiver: 'email-warning'

receivers:
  - name: 'email-default'
    email_configs:
      - to: 'team@yourdomain.ru'
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'

  - name: 'email-critical'
    email_configs:
      - to: 'oncall@yourdomain.ru'
        send_resolved: true
        html: |
          <h2 style="color:red;">🚨 CRITICAL: {{ .CommonLabels.alertname }}</h2>
          <p><strong>Описание:</strong> {{ .CommonAnnotations.description }}</p>
          {{ if .CommonAnnotations.runbook_url }}
          <p><a href="{{ .CommonAnnotations.runbook_url }}">📚 Runbook</a></p>
          {{ end }}

  - name: 'email-warning'
    email_configs:
      - to: 'team@yourdomain.ru'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
