title = "Gitleaks custom rules for experiments project"

[extend]
# Use default rules
path = "https://raw.githubusercontent.com/gitleaks/gitleaks/master/config/gitleaks.toml"

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "secret"]
severity = "critical"

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey)["\s:=]+["']?[A-Za-z0-9]{20,}["']?'''
tags = ["generic", "secret"]
severity = "high"

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["crypto", "secret"]
severity = "critical"

[[rules]]
id = "password-in-code"
description = "Hardcoded password"
regex = '''(?i)(password|passwd|pwd)\s*=\s*["'][^"']{4,}["']'''
tags = ["password", "secret"]
severity = "high"

[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
tags = ["github", "secret"]
severity = "critical"

[[rules]]
id = "database-url"
description = "Database connection string with password"
regex = '''(?i)(mongodb|postgres|mysql|redis):\/\/[^:]+:[^@]+@'''
tags = ["database", "secret"]
severity = "high"

[allowlist]
description = "Allowlisted files"
paths = [
  '''gitleaks.toml''',
  '''(.*)?tests?/.*''',
]
